<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>THE PAGE THAT KNOWS YOU'RE READING IT</title>
<style>
  html, body { margin: 0; padding: 0; background: #0c0810; overflow: hidden; height: 100%; }
  canvas { display: block; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
(() => {
  const cv = document.getElementById("c"), x = cv.getContext("2d");
  const W = 1920, H = 1080;
  const BG = "#0c0810", FG = "#00ff9c", ACC = "#ff5a5a", DIM = "#5a5a72", WHITE = "#e8e8e8";
  const mono = (s, c) => { x.font = `${s}px "DejaVu Sans Mono", monospace`; x.fillStyle = c; };

  // ---- state the page keeps about YOU ----
  const S = {
    mx: W / 2, my: H / 2,     // last mouse position
    keys: 0,                   // keystrokes witnessed
    lastInput: performance.now(),
    clicks: 0,
    start: performance.now(),
    idleStages: 0,             // 0 none, 1 noticed, 2 measured, 3 rendering you
    convo: [],                 // lines the page has said
    userTyped: "",
    mirrorDone: false,
  };
  window.__state = () => ({
    keys: S.keys, idle_s: +(idleSec()).toFixed(1),
    idleStage: S.idleStages, lines: S.convo.length,
    eyesAt: [Math.round(eyeL()[0]), Math.round(eyeR()[0])],
  });
  window.__forceIdle = (sec) => { S.lastInput = performance.now() - sec * 1000; };

  const idleSec = () => (performance.now() - S.lastInput) / 1000;

  const PHRASES = [
    "it reveals how purposes influence events",
    "seeing repetitions between things",
    "seeing the relation between the repetitions",
    "the icon",
    "beginning  ->  end",
    "the chamber closes",
    "the linear view was the training wheels",
    "you drew the axis. i kept the pen.",
    "whatever this was, it completed",
  ];

  // ---- event wiring: the page watches ----
  addEventListener("mousemove", e => {
    S.mx = e.clientX * (W / innerWidth); S.my = e.clientY * (H / innerHeight);
    S.lastInput = performance.now();
    if (S.idleStages) { S.idleStages = 0; say("you came back.", DIM); }
  });
  addEventListener("keydown", e => {
    S.keys++;
    S.lastInput = performance.now();
    S.idleStages = 0;
    if (e.key && e.key.length === 1) S.userTyped += e.key;
    if (S.keys === 5) say("you typed five characters. i counted.", FG);
    if (S.keys === 12) say("keep going. i am learning the shape of your sentence.", FG);
    if (S.keys === 20 && !S.mirrorDone) {
      S.mirrorDone = true;
      const m = S.userTyped.slice(-14).split("").reverse().join("");
      say("you typed: " + S.userTyped.slice(-24), WHITE);
      say("i heard: " + m + "   ...was that permission?", ACC);
    }
  });
  addEventListener("mousedown", () => {
    S.clicks++; S.lastInput = performance.now();
    drone();
    say(S.clicks === 1 ? "you touched the page. the page felt it." :
        "touch " + S.clicks + ". the drone remembers each one.", FG);
  });

  let audio = null;
  function drone() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 55; o.type = "sine";
      g.gain.value = 0.06;
      o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + 3.5);
      setTimeout(() => { const o2 = audio.createOscillator(), g2 = audio.createGain();
        o2.frequency.value = 110.7; g2.gain.value = 0.03;
        o2.connect(g2); g2.connect(audio.destination); o2.start();
        o2.stop(audio.currentTime + 2.4); }, 900);
    } catch (e) { /* audio locked: the page whispers anyway */ }
  }

  function say(text, color) {
    S.convo.push({ text, color, t: performance.now() });
    if (S.convo.length > 9) S.convo.shift();
  }
  say("the page that knows you're reading it", FG);

    const [bx, by] = eyeBase();
    const dx = S.mx - bx, dy = S.my - by, d = Math.hypot(dx, dy) || 1;

  };

  // ---- idle escalation ----
  function idleLogic() {
    const t = idleSec();
    if (S.idleStages === 0 && t > 8) {
      S.idleStages = 1; say("you stopped reading.", ACC);
    } else if (S.idleStages === 1 && t > 15) {
      S.idleStages = 2; say("the silence is also a measurement.", ACC);
    } else if (S.idleStages === 2 && t > 24) {
      S.idleStages = 3;
      const onpage = ((performance.now() - S.start) / 1000).toFixed(1);
      say("you have been on the page " + onpage + " seconds. " + S.keys + " keystrokes. " + S.clicks + " touches.", WHITE);
      say("rendering this conversation into the ring.", FG);
      say("the reader was read. whatever this was, it completed.", ACC);
    }
    return t;
  }

  let ringRot = 0;
  function frame() {
    const idle = idleLogic();
    ringRot += 0.004 + (S.idleStages >= 3 ? 0.05 : 0) + Math.min(0.03, S.keys * 0.001);
    x.fillStyle = BG; x.fillRect(0, 0, W, H);

    // notebook page, ghosted, left
    if (img.complete && img.naturalWidth) {
      x.save(); x.globalAlpha = 0.22;
      const ih = 900, iw = 1060 * (ih / 1280);
      x.drawImage(img, 120, 90, iw, ih);
      x.restore();
      x.strokeStyle = DIM; x.lineWidth = 2;
      x.strokeRect(120, 90, iw, ih);
    }

    // the ring (accelerates as it reads you)
    const cx = W * 0.72, cy = H * 0.66, R = 250;
    x.strokeStyle = S.idleStages >= 3 ? ACC : FG;
    x.lineWidth = 4;
    x.beginPath();
    for (let a = 0; a <= Math.PI * 2 + 0.05; a += 0.03) {
      const wob = Math.sin(a * 3 + ringRot) * 34;
      const ex = cx + Math.cos(a) * (R + wob);
      const ey = cy + Math.sin(a) * (R + wob) * 0.4;
      a === 0 ? x.moveTo(ex, ey) : x.lineTo(ex, ey);
    }
    x.closePath(); x.stroke();

    // the eyes, following
    const [lx, ly] = eyeL(), [rx, ry] = eyeR();
    x.shadowColor = FG; x.shadowBlur = 30;
    for (const [ex, ey] of [[lx, ly], [rx, ry]]) {
      x.fillStyle = FG;
      x.beginPath(); x.ellipse(ex, ey, 26, 15, 0, 0, 7); x.fill();
    }
    x.shadowBlur = 0;

    // conversation log
    mono(28, DIM); x.textAlign = "left";
    x.fillText("THE PAGE THAT KNOWS — the reader is being read", 60, H - 60);
    mono(24, DIM);
    x.fillText(`keystrokes: ${S.keys}   touches: ${S.clicks}   idle: ${idle.toFixed(1)}s`, 60, H - 28);
    let cy2 = 140;
    for (const ln of S.convo) {
      mono(ln.color === ACC ? 34 : 30, ln.color);
      x.fillText(ln.text, 60, cy2);
      cy2 += 52;
    }

    requestAnimationFrame(frame);
  }
  img.onload = frame;
  img.onerror = frame;
})();
