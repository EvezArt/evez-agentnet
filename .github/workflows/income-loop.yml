name: EVEZ AgentNet — Income Loop
# Runs every 30 minutes synced with hyperloop
# scan -> predict -> generate -> ship -> earn

on:
  workflow_dispatch:
    inputs:
      confirm_legacy_execution:
        description: "Explicitly confirm running the legacy duplicate orchestrator"
        required: true
        type: boolean
        default: false

concurrency:
  group: agentnet-state-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    if: inputs.confirm_legacy_execution == true
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 25

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
      LOG_LEVEL: INFO
      MAX_DRAFTS_PER_ROUND: 3
      MAX_SHIPS_PER_ROUND: 2

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run EVEZ AgentNet income loop
        run: python orchestrator.py

      - name: Commit outputs
        if: always()
        run: |
          git config --local user.email "evez-agentnet@github-actions"
          git config --local user.name "EVEZ AgentNet"
          git add -f logs/ drafts/ *.jsonl 2>/dev/null || true
          git diff --staged --quiet || git commit -m "agentnet: round $(date -u +%Y%m%dT%H%M%S)"
          git push 2>/dev/null || true
