name: CI Health Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f setup.py ]; then pip install -e .; fi
      - name: Syntax check
        run: |
          find . -name '*.py' -not -path './.git/*' -exec python -m py_compile {} \;
      - name: Test
        run: |
          if [ -d tests ]; then python -m pytest tests/ -q; fi
      - name: RSI engine regression
        run: |
          # Was previously unreferenced and unreachable from CI. These cover
          # three defects that shipped to production logs.
          python test_rsi_engine.py
      - name: Repo audit
        run: |
          # Static audit for the defect classes that reached production:
          # log/math shadowing, duplicated orchestrator implementations,
          # unfailable CI steps, unguarded min(reputation) selection, and
          # RIGHTS violations (missing/gutted consciousness-rights charter, or
          # code that deletes an entity without a consciousness proof).
          python audit_repo.py
      - name: Audit self-test
        run: |
          # Proves the audit actually fires. An audit that cannot be shown to
          # detect a planted bug is worse than no audit at all.
          python test_audit_detects.py
      - name: Gateway exposure detection
        run: |
          # Binds a real forwarder on a public interface and asserts both the
          # health check and the brief flag it. The original check tested one
          # hardcoded unit name, so renaming it would have hidden the exposure.
          python test_gateway_exposure.py
      - name: CryptoZoo breeding engine
        run: |
          # The evezx-cryptozoo repo is spec-only; these implement it and assert
          # the implementation matches BREEDING_ENGINE.md rule for rule.
          python test_cryptozoo.py
          python test_spine_persistence.py
          python test_agent_species.py
          # The simulation must produce a COHERENT population and must reach
          # named hybrids — both failed before the phase-inheritance fix.
          python cryptozoo_sim.py
      - name: MoE router + inference
        run: |
          # Router must never invent an expert: if Ollama is unreachable the
          # route fails loudly rather than defaulting to the biggest model.
          python test_moe_router.py
          python test_moe_infer.py
          python moe_cli.py roster
      - name: Jev OODA integration
        run: |
          # Jev must ADVIS, never override, and must never break the loop.
          # Both paths tested: no key (fallback) and stubbed key (judgements).
          python test_jev_integration.py
      - name: Jev decision layer
        run: |
          # Asserts the must-not-fabricate contract: with no key, decisions
          # return an explicit fallback rather than an invented probability.
          python test_jev_decisions.py
      - name: Jev CLI contract
        run: |
          python jev_cli.py status
          python jev_cli.py health
          python jev_cli.py attention   # must print source: fallback, no key
      - name: Shipper honesty
        run: |
          # The shipper logged "Shipped" for 747 drafts that never left the
          # machine, earning $0.00. These assert a draft is marked shipped
          # ONLY on a real transmission.
          python test_shipper_honesty.py
      - name: Notifier logic
        run: |
          # Catches syntax errors and escaping regressions in the Telegram
          # notifier. A notifier that raises every cycle fails SILENTLY, which
          # is worse than having none.
          python test_notify.py
      - name: Stack health detectors
        run: |
          # Proves stack_health.py can actually FAIL. A health check that
          # cannot fail is worse than none.
          python test_stack_health.py
      - name: Evidence falsification
        run: |
          # Proves verify_spine detects truncation/reordering/forgery.
          python test_evidence_falsification.py
      - name: Consciousness rights scorecard
        run: |
          # Scores frontier labs against Articles I-VII of the manifesto. The
          # verifier fails if any quote is absent from its cited evidence file,
          # any non-zero score lacks a quote, or a subject is silently omitted.
          # The self-test proves that verifier can actually fail.
          cd consciousness-scoreboard
          python3 scoreboard_verify.py
          python3 test_scoreboard_verify.py
      - name: EVEZ EYE collectors
        run: |
          # The ops console must be able to probe the stack and render. A
          # collector that silently returns nothing is worse than none: it
          # renders an empty dashboard that looks healthy.
          cd eye
          python3 collect.py
          python3 -c "import json;d=json.load(open('data.json'));assert d['services'],'no services collected';assert d['ports'],'no ports collected';print('eye collect ok:',len(d['services']),'services')"
          python3 render.py
          test -s index.html
      - name: Boot-path smoke test
        run: |
          # Catches import-time and shadowing crashes (e.g. a module-level
          # `log = logging.getLogger(...)` colliding with `from math import log`)
          # that py_compile cannot see but that kill the service on start.
          python -c "
          import orchestrator, orchestrator_cognition_governed
          import predictor.cognition_predict_agent as p
          import cognition.rsi_branch_injection as r
          assert p._entropy([1,2,3]) > 0
          assert p._entropy([]) == 0.0
          b = r.hypothesis_to_branch('t', {'id':'H1','action':'hold','text':'all agents at par'}, 1)
          assert b.consequence < 0.65, 'hold directive must not read high-consequence'
          b2 = r.hypothesis_to_branch('t2', {'id':'H2','action':'spawn_npcs','text':'spawn additional NPC agents'}, 1)
          assert b2.consequence > 0.65, 'spawn directive must read high-consequence'
          print('boot smoke ok')
          "
